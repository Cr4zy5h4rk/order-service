<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (order(); as orderRef) {
      <div>
        <h2 data-cy="orderDetailsHeading"><span jhiTranslate="orderApp.orderOrder.detail.title">Order</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ orderRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="orderApp.orderOrder.orderDate">Order Date</span></dt>
          <dd>
            <span>{{ orderRef.orderDate | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="orderApp.orderOrder.status">Status</span></dt>
          <dd>
            <span [jhiTranslate]="'orderApp.OrderStatus.' + (orderRef.status ?? 'null')">{{
              { null: '', PENDING: 'PENDING', CONFIRMED: 'CONFIRMED', SHIPPED: 'SHIPPED', CANCELLED: 'CANCELLED' }[
                orderRef.status ?? 'null'
              ]
            }}</span>
          </dd>
          <dt><span jhiTranslate="orderApp.orderOrder.customerId">Customer Id</span></dt>
          <dd>
            <span>{{ orderRef.customerId }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/order/order', orderRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
